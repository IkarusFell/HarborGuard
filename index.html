data:()=>h`<div class="space-y-4">${H2('Data protection and exposure')}
${Card('Support-ticket scanner',h`<textarea value=${tk} onInput=${e=>{setTk(e.target.value);setScan(null)}} rows="3" class=${IN}></textarea><div class="mt-2">${Bt('Scan ticket',()=>{const m=tk.match(/\b(bvk|key|tok)-[a-z0-9]{3,}\b/gi)||[];setScan(m.map(x=>x.slice(0,6)+'••••'));if(m.length){notify('Exposed credential found in ticket (simulated)','High');log('Ticket scan found '+m.length+' exposed credential(s)')}},ro)}</div>
${scan&&(scan.length?h`<div class="mt-3 p-3 rounded-xl bg-red-500/15 border border-red-400/30 pop text-sm"><b class="text-red-300">Credential exposure alert.</b> Found: ${scan.join(', ')} (masked). Rotate the key and remove it from the ticket. ${Bt('Open credential manager',()=>go('cred'))}</div>`:h`<p class="mt-3 text-sm text-emerald-300">No credential patterns found.</p>`)}`)}
${Card('Confidential file-access history',T(['Time','Key','File','Activity','Result'],F0.map(f=>[f.t,f.key,f.file,f.act,B(f.f)])))}</div>`,

mod:()=>h`<div class="space-y-4"><div>${H2('Content moderation')}<p class="text-xs text-slate-400">Support tickets, vendor notes and comments are scanned. Flagged content is held for review; escalating it opens an incident.</p></div>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${KPI('Pending review',mcnt('Pending'),'text-sky-300')}${KPI('Redacted',mcnt('Redacted'),'text-violet-300')}${KPI('Removed',mcnt('Removed'),'text-red-300')}${KPI('Escalated',mcnt('Escalated'),'text-amber-300')}</div>
<div class="grid lg:grid-cols-2 gap-3">${Card('Detection rules',h`<div class="space-y-2 text-sm">${MR.map(r=>h`<label class="flex items-center justify-between"><span>${r.name} ${B(r.sev)}</span><input type="checkbox" class="w-4 h-4 accent-blue-400" disabled=${!canRev} checked=${!!mon[r.id]} onChange=${()=>{setMon(o=>({...o,[r.id]:!o[r.id]}));log('Moderation rule “'+r.name+'” '+(mon[r.id]?'disabled':'enabled'))}}/></label>`)}${!canRev&&h`<p class="text-xs text-slate-400">Only Admin can change rules.</p>`}</div>`)}
${Card('Submit test content',h`<div class="space-y-2 text-sm"><select value=${msrc} onChange=${e=>setMsrc(e.target.value)} class=${IN}><option>Support ticket</option><option>Vendor note</option><option>Internal comment</option></select><textarea value=${mtxt} onInput=${e=>setMtxt(e.target.value)} rows="3" placeholder="Try: use key tok-9ab21 and pay the new account 4417002211" class=${IN}></textarea>${Bt('Run moderation',mSubmit,ro||!mtxt.trim())}</div>`)}</div>
${Card('Review queue (highest severity first)',h`<div class="flex flex-wrap gap-2 mb-3">${['Pending','Redacted','Removed','Escalated','Approved','All'].map(s=>Bt(s,()=>setMf(s),false,mf===s?'bg-blue-400 text-slate-950':GH))}</div>
${mshown.length===0?h`<p class="text-sm text-slate-400">Nothing in this view.</p>`:h`<div class="space-y-3">${mshown.map(x=>h`<div class="p-3 rounded-xl bg-white/5 border border-white/10"><div class="flex flex-wrap items-center gap-2 justify-between"><div class="text-xs text-slate-400">${x.id} · ${x.src} · ${x.by} · ${x.t}</div><div class="flex gap-1.5">${x.sev&&B(x.sev)}${B(x.st)}</div></div><p class="text-sm mt-2 break-words">${x.text}</p>
${x.f.length>0&&h`<div class="flex flex-wrap gap-1.5 mt-2">${x.f.map(r=>h`<span class="px-2 py-0.5 rounded-md text-xs bg-red-500/15 text-red-300">${r.name}</span>`)}</div>`}
${x.st==='Pending'&&h`<div class="flex flex-wrap gap-2 mt-3">${Bt('Approve',()=>mAct(x,'Approved','approved after review'),ro)}${Bt('Redact & approve',()=>mAct(x,'Redacted','sensitive parts redacted',true),ro||!x.f.some(r=>r.mask),VI)}${Bt('Remove',()=>mAct(x,'Removed','removed'),ro,DG)}${Bt('Escalate',()=>mAct(x,'Escalated','escalated; incident opened'),ro,WR)}</div>`}</div>`)}</div>`}`)}</div>`,

inc:()=>{const c=inc.find(x=>x.id===sel)||inc[0];return h`<div class="space-y-4">${H2('Incident management')}<div class="grid lg:grid-cols-2 gap-3">${Card('Alerts and incidents',T(['ID','Title','Severity','Status'],inc.map(x=>[h`<button class="text-blue-300 font-semibold underline" onClick=${()=>setSel(x.id)}>${x.id}</button>`,x.title,B(x.sev),B(x.st)])))}
${c&&Card(c.id+' · '+c.title,h`<div class="space-y-3 text-sm"><div class="flex flex-wrap gap-2 items-center"><label class="text-xs text-slate-400">Status</label><select disabled=${ro} value=${c.st} onChange=${e=>setSt(c.id,'st',e.target.value)} class="border border-white/10 rounded p-1 text-xs bg-slate-900">${['New','Investigating','Contained','Resolved'].map(s=>h`<option>${s}</option>`)}</select><label class="text-xs text-slate-400">Owner</label><select disabled=${ro} value=${c.own} onChange=${e=>setSt(c.id,'own',e.target.value)} class="border border-white/10 rounded p-1 text-xs bg-slate-900">${['Unassigned','Security Admin','SOC Analyst'].map(s=>h`<option>${s}</option>`)}</select></div>
<ol class="space-y-1 border-l-2 border-blue-400/30 ml-2">${c.tl.map(t=>h`<li class="pl-3 text-xs"><span class="text-slate-400">${t[0]}</span> ${t[1]}</li>`)}</ol>
<div><div class="text-xs text-slate-400 mb-1">Recommended response</div><ul class="list-disc ml-5 text-xs space-y-0.5">${c.rc.map(r=>h`<li>${r}</li>`)}</ul></div>${Bt('Create incident report',()=>setRep(c))}</div>`)}</div></div>`},

aud:()=>h`<div class="space-y-4">${H2('Security event history and audit trail')}${Card('Audit trail',h`<div class="mb-3">${Bt('Copy log to clipboard',()=>{try{navigator.clipboard.writeText(aud.map(a=>a.t+' | '+a.u+' | '+a.m).join('\n'))}catch(e){}},false,GH)}</div>${T(['Time','User','Action'],aud.map(a=>[a.t,a.u,a.m]))}`)}</div>`,

help:()=>h`<div class="space-y-4 max-w-3xl">${H2('Help and documentation')}${Card('How HARBOR GUARD covers the problems',h`<ul class="text-sm space-y-2 list-disc ml-5"><li><b>Unauthorised bank changes:</b> Financial protection blocks any change without an approval reference.</li><li><b>Misused API credentials:</b> Credential manager scores risk, flags missing expiry and IP limits, and simulates rotation and revocation.</li><li><b>Bulk exports:</b> API monitoring flags unusual volumes and sources, and simulates blocking.</li><li><b>Exposed credentials:</b> Data exposure scans tickets and shows masked results only.</li><li><b>Risky content:</b> Moderation holds flagged tickets and notes, redacts sensitive parts, and escalates to incidents.</li><li><b>Slow response:</b> Incidents tracks status, owner, timeline and an audit trail.</li></ul><p class="text-xs text-slate-400 mt-3">Roles: Admin can do everything, Analyst cannot revoke keys or change moderation rules, Auditor is read-only, and Viewer sees only the dashboard summary and this page with no details and no changes. Admin, Analyst and Auditor need a password to sign in. Everything here is fictional and local to this page; it provides no real protection.</p><p class="text-xs text-slate-400 mt-2">Designed and coded by Team ${TEAM}.</p>`)}</div>`};

return h`<div class="min-h-screen flex flex-col">
<header class="bg-slate-950/85 backdrop-blur border-b border-white/10 sticky top-0 z-30">
<div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3 relative"><div class="shrink-0"><div class="hd font-extrabold text-blue-300 leading-none">HARBOR GUARD</div><div class="nt text-sm text-slate-300 mt-0.5">by NullTrace</div></div>
<div class="flex-1 relative"><input value=${q} onInput=${e=>setQ(e.target.value)} disabled=${vw} placeholder=${vw?'Search is disabled for Viewer':'Search vendors, keys, incidents, events, content'} class="w-full bg-white/5 border border-white/10 rounded-full px-4 py-2 text-sm focus:border-blue-400"/>${results.length>0&&h`<div class="absolute z-20 mt-1 w-full bg-slate-950 border border-white/10 rounded-xl shadow-lg p-1">${results.map(r=>h`<button onClick=${()=>{go(r[2]);setQ('')}} class="w-full text-left px-3 py-2 text-sm rounded-lg hover:bg-white/10">${r[0]} <span class="text-xs text-slate-400">· ${r[1]}</span></button>`)}</div>`}</div>
<button disabled=${vw} onClick=${()=>setBell(!bell)} class="px-3 py-2 rounded-full bg-white/5 text-sm disabled:opacity-40">Alerts <span class="ml-1 px-1.5 rounded-full bg-red-500 text-white text-xs">${vw?'–':notes.length}</span></button>
<span class="text-xs text-slate-400 hidden md:block">${user} · ${role}${since?' · since '+since:''}</span>${Bt('Sign out',()=>{setUser(null);setStep(0)},false,GH)}
${bell&&h`<div class="absolute right-4 top-14 z-30 w-80 max-w-[92vw] bg-slate-950 border border-white/10 rounded-xl shadow-xl p-3 pop max-h-96 overflow-auto"><div class="flex justify-between mb-2 text-sm font-bold">Notification centre ${Bt('Clear',()=>setN([]),false,GH)}</div>${notes.length?notes.map(n=>h`<div class="py-2 border-t border-white/10 text-xs"><div>${n.m}</div><div class="text-slate-400 mt-0.5">${n.t} ${B(n.s)}</div></div>`):h`<p class="text-xs text-slate-400">No notifications. Run the simulation to generate some.</p>`}</div>`}</div>
<nav class="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto pb-2">${NAV.map(([k,l])=>h`<button onClick=${()=>go(k)} class=${'whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-semibold transition '+(view===k?'bg-blue-400 text-slate-950':'text-slate-300 hover:bg-white/10')}>${l}</button>`)}</nav></header>
<main class="max-w-6xl w-full mx-auto p-4 pop flex-1" key=${view}>${views[view]()}</main>
<footer class="text-center text-xs text-slate-400 pb-6">HARBOR GUARD · Designed & coded by Team <b class="nt text-base text-blue-200">${TEAM}</b></footer>
${rep&&h`<div class="fixed inset-0 z-40 bg-slate-900/50 grid place-items-center p-4" onClick=${()=>setRep(null)}><div class="bg-slate-950 border border-white/10 rounded-2xl shadow-xl p-5 max-w-lg w-full pop" onClick=${e=>e.stopPropagation()}><h3 class="hd font-bold mb-2">Incident report: ${rep.id}</h3><pre class="text-xs whitespace-pre-wrap bg-white/5 border border-white/10 p-3 rounded-lg max-h-72 overflow-auto">${'SIMULATED INCIDENT REPORT\nID: '+rep.id+'\nTitle: '+rep.title+'\nSeverity: '+rep.sev+'\nStatus: '+rep.st+'\nOwner: '+rep.own+'\n\nTimeline:\n'+rep.tl.map(t=>'- '+t[0]+' '+t[1]).join('\n')+'\n\nRecommended response:\n'+rep.rc.map(r=>'- '+r).join('\n')+'\n\nAll data is fictional. Prepared by Team '+TEAM+'.'}</pre><div class="flex gap-2 mt-3">${Bt('Copy report',()=>{try{navigator.clipboard.writeText(document.querySelector('pre').innerText);log('Report for '+rep.id+' copied')}catch(e){}})}${Bt('Close',()=>setRep(null),false,GH)}</div></div></div>`}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
}
</script></body></html>
