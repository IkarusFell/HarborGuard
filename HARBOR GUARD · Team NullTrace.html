<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(1100px 520px at 85% -10%,rgba(37,99,235,.30),transparent),#050a14;color:#d6e4f5;font-family:Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.hd{font-family:'JetBrains Mono',ui-monospace,monospace}
.g{background:rgba(14,24,44,.62);border:1px solid rgba(96,165,250,.20);backdrop-filter:blur(14px);border-radius:10px}
.pop{animation:pop .25s ease}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div id="root"></div>
<script>
const{useState}=React,h=htm.bind(React.createElement);
const TEAM='NullTrace';
const now=()=>new Date().toISOString().slice(11,19)+' UTC';
const CL={Critical:'bg-red-500/20 text-red-300',High:'bg-orange-500/20 text-orange-300',Medium:'bg-yellow-400/20 text-yellow-200',Low:'bg-emerald-500/20 text-emerald-300',Suspicious:'bg-red-500/20 text-red-300',Normal:'bg-emerald-500/20 text-emerald-300',Unusual:'bg-orange-500/20 text-orange-300',New:'bg-sky-500/20 text-sky-300',Pending:'bg-sky-500/20 text-sky-300',Investigating:'bg-amber-500/20 text-amber-200',Escalated:'bg-amber-500/20 text-amber-200',Contained:'bg-violet-500/20 text-violet-300',Redacted:'bg-violet-500/20 text-violet-300',Resolved:'bg-emerald-500/20 text-emerald-300',Blocked:'bg-red-500/20 text-red-300',Removed:'bg-red-500/20 text-red-300',Revoked:'bg-slate-500/30 text-slate-300',Approved:'bg-emerald-500/20 text-emerald-300'};
const B=t=>h`<span class=${'px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap '+(CL[t]||'bg-slate-500/20 text-slate-300')}>${t}</span>`;
const Bt=(l,f,d,c)=>h`<button disabled=${d} onClick=${f} class=${'px-3 py-1.5 rounded-lg text-xs font-medium transition disabled:opacity-40 disabled:cursor-not-allowed '+(c||'bg-cyan-500/20 text-cyan-200 hover:bg-cyan-500/30')}>${l}</button>`;
const T=(cols,rows)=>h`<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-400 text-xs">${cols.map(c=>h`<th class="py-2 pr-3 font-medium">${c}</th>`)}</tr></thead><tbody>${rows.map(r=>h`<tr class="border-t border-white/5">${r.map(c=>h`<td class="py-2 pr-3 align-middle">${c}</td>`)}</tr>`)}</tbody></table></div>`;
const Card=(t,c,x)=>h`<section class=${'g p-4 '+(x||'')}><h3 class="text-sm font-semibold text-slate-200 mb-3">${t}</h3>${c}</section>`;
const score=c=>c.rev?0:Math.min(100,(c.exp?0:30)+(c.ip?0:30)+c.perms.reduce((a,p)=>a+(/write|export/.test(p)?15:5),0));
const lvl=s=>s>=70?'High':s>=40?'Medium':'Low';
const rec=c=>[...c.perms.filter(p=>/write|export/.test(p)).map(p=>'Remove “'+p+'” unless a named process needs it'),...(c.ip?[]:['Restrict to approved IP ranges']),...(c.exp?[]:['Set a 90-day expiry'])];
const V0=[{id:'V-0412',n:'Coastal Packaging Ltd.',a:'4417'},{id:'V-0388',n:'Northwind Pallets',a:'2210'},{id:'V-0501',n:'Meridian Cold Chain',a:'7731'},{id:'V-0295',n:'Aster Customs Brokers',a:'1056'}];
const C0=[{id:'key-tb-07',app:'TallyBridge',perms:['vendors:read','vendors:export','vendor-bank:write','payments:read'],exp:null,ip:false},{id:'bvk-7f3a',app:'BlueVault',perms:['files:list','files:read','finance:download'],exp:null,ip:false},{id:'key-lo-02',app:'LedgerOne',perms:['invoices:read','vendors:export'],exp:'2026-12-31',ip:false},{id:'key-hd-01',app:'HelpDeskr',perms:['tickets:read','tickets:export'],exp:null,ip:true},{id:'key-sync-03',app:'Internal sync',perms:['ledger:read'],exp:'2027-03-01',ip:true}];
const E0=[{id:1,t:'09:02:11 UTC',ip:'10.20.4.12',key:'key-sync-03',act:'Scheduled ledger sync (internal)',f:'Normal'},{id:2,t:'09:14:40 UTC',ip:'198.18.7.58',key:'key-hd-01',act:'Bulk export, 9,800 records',f:'Suspicious'},{id:3,t:'09:21:05 UTC',ip:'198.18.7.41',key:'key-tb-07',act:'Vendor list downloaded 40 times',f:'Suspicious'},{id:4,t:'09:24:52 UTC',ip:'198.18.7.41',key:'key-tb-07',act:'Deleted 12 vendor drafts',f:'Suspicious'},{id:5,t:'09:30:18 UTC',ip:'10.20.4.30',key:'key-lo-02',act:'Invoice read',f:'Normal'}];
const F0=[{t:'Day 1 08:10',key:'bvk-7f••',file:'finance/bank-instructions-Q2.xlsx',act:'List + download',f:'Unusual'},{t:'Day 1 08:12',key:'bvk-7f••',file:'finance/vendor-payments.csv',act:'Download',f:'Unusual'},{t:'Day 2 11:40',key:'bvk-ops••',file:'ops/schedules.pdf',act:'Read',f:'Normal'}];
const I0=[{id:'INC-1001',title:'Bank-detail change without approval',sev:'Critical',st:'Investigating',own:'Security Admin',tl:[['09:40','Change request for V-0412 received'],['09:40','No approval reference found'],['09:41','Change held for review']],rc:['Confirm the request with the vendor by phone','Review who submitted the change','Keep the payment hold in place']},{id:'INC-1002',title:'Credential exposed in support ticket',sev:'High',st:'New',own:'Unassigned',tl:[['08:55','Ticket text scanned'],['08:55','Key pattern bvk-7f•• detected']],rc:['Rotate the exposed key','Remove it from the ticket','Review file access since exposure']},{id:'INC-1003',title:'Bulk vendor export from unusual IP',sev:'High',st:'Contained',own:'Security Admin',tl:[['09:14','Export of 9,800 records'],['09:16','Source 198.18.7.58 blocked']],rc:['Review exported records','Restrict key-hd-01 to known IPs']}];
const KW=[['Financial',9],['Credentials',14],['API behaviour',21],['Data exposure',11],['Response delays',7]];
const AP=[20,18,15,14,16,22,35,48,60,66,70,72,68,71,74,69,64,58,50,44,38,30,26,22];
const EX=[['Mon',2],['Tue',1],['Wed',3],['Thu',2],['Fri',10],['Sat',4],['Sun',1]];

/* moderation config and helpers */
const MR=[{id:'cred',name:'Exposed credential',sev:'High',re:/\b(bvk|key|tok)-[a-z0-9]{3,}\b/gi,mask:1},{id:'acct',name:'Bank account number',sev:'Critical',re:/\b\d{8,18}\b/g,mask:1},{id:'pii',name:'Email address',sev:'Medium',re:/[\w.+-]+@[\w-]+\.[\w.]+/g,mask:1},{id:'push',name:'Payment pressure / bank change',sev:'Medium',re:/\b(urgent(ly)?|immediately|change (the )?bank|new account)\b/gi},{id:'abuse',name:'Abusive language',sev:'Low',re:/\b(idiot|stupid|useless|scam)\b/gi}];
const RK={Low:1,Medium:2,High:3,Critical:4};
const MON=Object.fromEntries(MR.map(r=>[r.id,true]));
const scanM=(t,on)=>MR.filter(r=>on[r.id]&&(t.match(r.re)||[]).length>0);
const worst=f=>f.reduce((a,r)=>RK[r.sev]>RK[a]?r.sev:a,'Low');
const maskT=(t,on)=>MR.filter(r=>r.mask&&on[r.id]).reduce((s,r)=>s.replace(r.re,'••••'),t);
const mkM=(n,src,by,text,on)=>{const f=scanM(text,on);return{id:'M-'+(100+n),src,by,text,f,sev:f.length?worst(f):null,st:f.length?'Pending':'Approved',t:now()}};
const MSEED=[['Support ticket','customer.a','Sync fails. We are using key bvk-7f3a as discussed, please check.'],['Vendor note','ops.temp','Urgent: change the bank for Coastal Packaging to account 5521908833 immediately.'],['Support ticket','customer.b','You are useless, this portal is a scam. Email me at pat@example.com.'],['Vendor note','ops.lead','Pallet delivery moved to Thursday, dock 4.']];

const Bars=(d,col)=>{const m=Math.max(...d.map(x=>x[1]));return h`<div class="space-y-2">${d.map(([k,v])=>h`<div class="flex items-center gap-2 text-xs"><span class="w-24 text-slate-400 shrink-0">${k}</span><div class="flex-1 h-3 rounded bg-white/5"><div class="h-3 rounded transition-all duration-700" style=${{width:v/m*100+'%',background:col}}></div></div><span class="w-6 text-right">${v}</span></div>`)}</div>`};
const Area=d=>{const m=Math.max(...d),p=d.map((v,i)=>(i/(d.length-1)*300)+','+(95-v/m*85)).join(' ');return h`<svg viewBox="0 0 300 100" class="w-full h-36"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa" stop-opacity=".45"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></linearGradient></defs><polygon points=${'0,100 '+p+' 300,100'} fill="url(#ag)"/><polyline points=${p} fill="none" stroke="#60a5fa" stroke-width="2"/></svg>`};
const Donut=parts=>{const t=parts.reduce((a,x)=>a+x[1],0)||1;let o=0;return h`<div class="flex items-center gap-4"><svg viewBox="0 0 42 42" class="w-28 h-28 -rotate-90"><circle cx="21" cy="21" r="15.9" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="6"/>${parts.map(([k,v,c])=>{const l=v/t*100,e=h`<circle cx="21" cy="21" r="15.9" fill="none" stroke=${c} stroke-width="6" stroke-dasharray=${l+' '+(100-l)} stroke-dashoffset=${-o}/>`;o+=l;return e})}</svg><div class="text-xs space-y-1">${parts.map(([k,v,c])=>h`<div><span class="inline-block w-2 h-2 rounded-full mr-2" style=${{background:c}}></span>${k}: ${v}</div>`)}</div></div>`};

function App(){
const[user,setUser]=useState(null),[role,setRole]=useState('Admin'),[view,setView]=useState('dash'),[q,setQ]=useState(''),[bell,setBell]=useState(false);
const[vendors,setV]=useState(V0),[creds,setC]=useState(C0),[ev,setE]=useState(E0),[inc,setI]=useState(I0),[aud,setA]=useState([{t:'08:00:00 UTC',u:'system',m:'Demo environment started with simulated data (Team '+TEAM+')'}]);
const[notes,setN]=useState([{t:'08:55:02 UTC',m:'Credential pattern found in ticket TKT-48213 (simulated)',s:'High'}]);
const[stats,setS]=useState({blk:1284,sus:37,crit:2}),[sim,setSim]=useState([]),[run,setRun]=useState(false),[blk,setBlk]=useState({}),[sel,setSel]=useState('INC-1001'),[rep,setRep]=useState(null);
const[fv,setFv]=useState('V-0412'),[fn,setFn]=useState('9083'),[fr,setFr]=useState(''),[fres,setFres]=useState(null),[chg,setChg]=useState([{t:'Day 0 10:05',v:'V-0295',f:'1056',to:'1056',ref:'—',by:'—',st:'Baseline'}]);
const[tk,setTk]=useState('Customer says the sync fails. We are using key bvk-7f3a as discussed, please check.'),[scan,setScan]=useState(null);
const[mon,setMon]=useState(MON),[mod,setMod]=useState(()=>MSEED.map((s,i)=>mkM(i,s[0],s[1],s[2],MON))),[mf,setMf]=useState('Pending'),[msrc,setMsrc]=useState('Support ticket'),[mtxt,setMtxt]=useState('');
const ro=role==='Auditor',canRev=role==='Admin';
const log=m=>setA(a=>[{t:now(),u:user||'system',m},...a]);
const notify=(m,s)=>setN(n=>[{t:now(),m,s},...n]);
const mkInc=(title,sev,tl,rc)=>{const id='INC-'+(1000+Math.floor(Math.random()*9000));setI(i=>[{id,title,sev,st:'New',own:'Security Admin',tl:[[now().slice(0,5),'Incident created automatically'],...tl],rc},...i]);log('Incident '+id+' created: '+title);return id};
const NAV=[['dash','Dashboard'],['fin','Financial protection'],['cred','Credential manager'],['api','API monitoring'],['data','Data exposure'],['mod','Moderation'],['inc','Incidents'],['aud','Event history'],['help','Help']];
const go=v=>{setView(v);setBell(false)};

const mAct=(x,st,m,red)=>{setMod(l=>l.map(i=>i.id===x.id?{...i,st,text:red?maskT(i.text,mon):i.text}:i));log(x.id+': '+m);if(st==='Escalated')mkInc('Escalated content '+x.id+' ('+x.src+')',x.sev||'Medium',[[now().slice(0,5),'Flagged: '+x.f.map(r=>r.name).join(', ')]],['Review the content','Contact the author if needed'])};
const mSubmit=()=>{if(!mtxt.trim())return;const it=mkM(mod.length,msrc,user,mtxt,mon);setMod(l=>[it,...l]);setMf(it.st);setMtxt('');if(it.f.length){notify('Content '+it.id+' held for review: '+it.f.map(r=>r.name).join(', '),it.sev);log(it.id+' held for review')}else log(it.id+' auto-approved by moderation')};

const runSim=async()=>{if(run)return;setRun(true);setSim([]);const w=ms=>new Promise(r=>setTimeout(r,ms));
const st=[['Suspicious API request detected','198.18.7.41 used key-tb-07 outside its normal range',()=>{setE(e=>[{id:Date.now(),t:now(),ip:'198.18.7.41',key:'key-tb-07',act:'Unusual-location request (simulation)',f:'Suspicious'},...e]);setS(s=>({...s,sus:s.sus+1,blk:s.blk+3}))}],
['Unusual bulk export identified','4,210 records exported in 90 seconds',()=>{setE(e=>[{id:Date.now()+1,t:now(),ip:'198.18.7.41',key:'key-tb-07',act:'Bulk export, 4,210 records (simulation)',f:'Suspicious'},...e]);setS(s=>({...s,sus:s.sus+1}))}],
['Credential risk warning','key-tb-07 has no expiry and no IP restriction',()=>notify('key-tb-07 is high risk: no expiry, no IP restriction','High')],
['Bank change blocked','V-0412 ****4417 to ****9083. BLOCKED – APPROVAL REQUIRED',()=>{setS(s=>({...s,blk:s.blk+1}));notify('Unapproved bank change on V-0412 blocked','Critical')}],
['Incident created automatically','Assigned to Security Admin',()=>mkInc('Simulated chain: export, key risk, blocked bank change','Critical',[[now().slice(0,5),'Bulk export from 198.18.7.41'],[now().slice(0,5),'Bank change on V-0412 blocked']],['Rotate key-tb-07','Restrict it to approved IPs','Confirm V-0412 details with the vendor'])],
['Dashboard updated','Alert counts refreshed',()=>setS(s=>({...s,crit:s.crit+1}))]];
for(const[a,b,f]of st){await w(900);f();setSim(x=>[...x,{a,b,t:now()}])}
log('Security simulation completed');setRun(false)};

const submitChg=()=>{const v=vendors.find(x=>x.id===fv);if(!/^\d{4}$/.test(fn)){setFres({k:'err',m:'Enter exactly 4 digits for the new account ending.'});return}
if(!fr.trim()){setS(s=>({...s,blk:s.blk+1,crit:s.crit+1}));setChg(c=>[{t:now(),v:v.id,f:v.a,to:fn,ref:'Missing',by:user,st:'Blocked'},...c]);notify('Unapproved bank change on '+v.id+' blocked','Critical');log('Bank change on '+v.id+' blocked: no approval reference');mkInc('Bank change attempted without approval on '+v.id,'Critical',[[now().slice(0,5),'Requested by '+user],[now().slice(0,5),'Approval reference missing']],['Confirm with the vendor by phone','Review the requester']);setFres({k:'blk',v,to:fn})}
else{setV(x=>x.map(y=>y.id===v.id?{...y,a:fn}:y));setChg(c=>[{t:now(),v:v.id,f:v.a,to:fn,ref:fr,by:user,st:'Approved'},...c]);log('Bank change on '+v.id+' approved (ref '+fr+') by Finance Head (simulated)');setFres({k:'ok',v,to:fn})}};

const setSt=(id,k,val)=>{setI(i=>i.map(x=>x.id===id?{...x,[k]:val}:x));log(id+': '+(k==='st'?'status':'owner')+' set to '+val)};
const act=(id,f)=>setC(c=>c.map(x=>x.id===id?f(x):x));
const results=q.trim().length<2?[]:[...vendors.map(x=>[x.n+' ('+x.id+')','Vendor','fin']),...creds.map(x=>[x.id+' · '+x.app,'Credential','cred']),...inc.map(x=>[x.id+' · '+x.title,'Incident','inc']),...ev.map(x=>[x.ip+' · '+x.act,'Event','api']),...mod.map(x=>[x.id+' · '+x.text.slice(0,40),'Moderation','mod'])].filter(r=>r[0].toLowerCase().includes(q.trim().toLowerCase())).slice(0,6);

if(!user)return h`<div class="min-h-screen grid place-items-center p-4"><div class="g p-8 w-full max-w-md pop"><div class="text-cyan-300 text-sm mb-1">Harbor & Finch Freight · Case CR-26-047</div><h1 class="text-3xl font-bold mb-2">HARBOR GUARD</h1><p class="text-sm text-slate-400 mb-6">One platform for vendor payments, API keys, data exports, exposed credentials, content moderation and incident response. This is a prototype with simulated data. It does not connect to real systems.</p><label class="text-xs text-slate-400">Demo role</label><select value=${role} onChange=${e=>setRole(e.target.value)} class="w-full mt-1 mb-4 bg-slate-900 border border-white/10 rounded-lg p-2 text-sm"><option>Admin</option><option>Analyst</option><option>Auditor</option></select><button onClick=${()=>{setUser(role==='Admin'?'admin.demo':role.toLowerCase()+'.demo')}} class="w-full py-2.5 rounded-lg bg-cyan-400 text-slate-950 font-semibold hover:bg-cyan-300 transition">Sign in as demo ${role}</button><p class="text-xs text-slate-500 text-center mt-5">Built by Team <b class="text-cyan-300">${TEAM}</b></p></div></div>`;

const risk=[['High',creds.filter(c=>lvl(score(c))==='High').length,'#f87171'],['Medium',creds.filter(c=>lvl(score(c))==='Medium').length,'#facc15'],['Low',creds.filter(c=>lvl(score(c))==='Low').length,'#34d399']];
const status=stats.crit>=3?['At risk','text-red-300']:['Elevated','text-amber-300'];
const KPI=(l,v,c)=>h`<div class="g p-4"><div class="text-xs text-slate-400">${l}</div><div class=${'text-2xl font-bold mt-1 hd '+(c||'')}>${v}</div></div>`;
const evTbl=(rows,blocker)=>T(['Time','Source IP','Key','Activity','Result',blocker?'Action':''].filter((x,i)=>blocker||i<5),rows.map(e=>[e.t,e.ip,e.key,e.act,blk[e.id]?B('Blocked'):B(e.f),...(blocker?[e.f==='Suspicious'&&!blk[e.id]?Bt('Block request',()=>{setBlk(b=>({...b,[e.id]:1}));setS(s=>({...s,blk:s.blk+1}));log('Simulated block of '+e.ip)},ro,'bg-red-500/20 text-red-300 hover:bg-red-500/30'):'—']:[])]));
const mshown=mod.filter(x=>mf==='All'||x.st===mf).sort((a,b)=>(RK[b.sev]||0)-(RK[a.sev]||0));
const mcnt=s=>mod.filter(x=>x.st===s).length;

const views={
dash:()=>h`<div class="space-y-4"><div class="flex flex-wrap items-center gap-3 justify-between"><div><h2 class="text-xl font-bold">Security overview</h2><p class="text-xs text-slate-400">All figures are simulated for demonstration.</p></div><button onClick=${runSim} disabled=${run||ro} class="px-4 py-2 rounded-lg bg-cyan-400 text-slate-950 font-semibold text-sm hover:bg-cyan-300 disabled:opacity-50 transition">${run?'Simulation running…':'RUN SECURITY SIMULATION'}</button></div>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${KPI('Overall status',status[0],status[1])}${KPI('Critical alerts',stats.crit,'text-red-300')}${KPI('Protected credentials',creds.filter(c=>lvl(score(c))==='Low').length+' / '+creds.length)}${KPI('Suspicious activities',stats.sus,'text-amber-300')}${KPI('Blocked requests',stats.blk.toLocaleString())}${KPI('Protected vendors',vendors.length)}${KPI('Moderation queue',mcnt('Pending'),'text-sky-300')}</div>
${(sim.length>0||run)&&Card('Simulation timeline',h`<ol class="space-y-3 border-l border-cyan-400/30 ml-2">${sim.map((s,i)=>h`<li class="pl-4 relative pop"><span class="absolute -left-[5px] top-1.5 w-2 h-2 rounded-full bg-cyan-400"></span><div class="text-sm font-medium">${s.a}</div><div class="text-xs text-slate-400">${s.t} · ${s.b}</div></li>`)}</ol>`)}
<div class="grid lg:grid-cols-2 gap-3">${Card('Incidents by category',Bars(KW,'#60a5fa'))}${Card('API activity, last 24 hours (requests per minute)',Area(AP))}${Card('Suspicious export jobs by day',Bars(EX,'#f87171'))}${Card('Credential risk levels',Donut(risk))}</div>
${Card('Recent security events',evTbl(ev.slice(0,5)))}</div>`,

fin:()=>h`<div class="space-y-4"><h2 class="text-xl font-bold">Financial transaction protection</h2>
<div class="grid lg:grid-cols-2 gap-3">${Card('Registered vendors',T(['ID','Vendor','Account'],vendors.map(v=>[v.id,v.n,'****'+v.a])))}
${Card('Request a bank-account change',h`<div class="space-y-2 text-sm"><select value=${fv} onChange=${e=>setFv(e.target.value)} class="w-full bg-slate-900 border border-white/10 rounded-lg p-2">${vendors.map(v=>h`<option value=${v.id}>${v.n} (${v.id})</option>`)}</select><input value=${fn} onInput=${e=>setFn(e.target.value)} maxlength="4" placeholder="New account, last 4 digits" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2"/><input value=${fr} onInput=${e=>setFr(e.target.value)} placeholder="Approval reference (try AP-2026-118, or leave empty)" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2"/><div class="flex gap-2">${Bt('Submit change',submitChg,ro)}${Bt('Load V-0412 example',()=>{setFv('V-0412');setFn('9083');setFr('');setFres(null)},false,'bg-white/10 text-slate-200 hover:bg-white/15')}</div>
${fres&&(fres.k==='err'?h`<p class="text-amber-300 text-xs">${fres.m}</p>`:fres.k==='blk'?h`<div class="p-3 rounded-lg bg-red-500/15 border border-red-400/30 pop"><div class="font-bold text-red-300 hd">BLOCKED – APPROVAL REQUIRED</div><div class="text-xs mt-1">${fres.v.n} · ${fres.v.id} · ****${fres.v.a} to ****${fres.to} · Approval reference: Missing</div></div>`:h`<div class="p-3 rounded-lg bg-emerald-500/15 border border-emerald-400/30 pop"><div class="font-bold text-emerald-300 hd">APPROVED</div><div class="text-xs mt-1">${fres.v.id} now ****${fres.to}. Recorded in the audit trail.</div></div>`)}</div>`)}</div>
${Card('Change history (requested by / approval)',T(['Time','Vendor','From','To','Approval ref','Requested by','Result'],chg.map(c=>[c.t,c.v,'****'+c.f,'****'+c.to,c.ref,c.by,c.st==='Baseline'?'—':B(c.st)])))}</div>`,

cred:()=>h`<div class="space-y-4"><h2 class="text-xl font-bold">Credential manager</h2>${creds.map(c=>{const s=score(c),l=lvl(s);return h`<div class="g p-4"><div class="flex flex-wrap items-center gap-2 justify-between"><div><span class="font-semibold">${c.id}</span> <span class="text-slate-400 text-sm">· ${c.app}</span></div><div class="flex items-center gap-2">${c.rev?B('Revoked'):B(l)}<span class="text-xs text-slate-400">Risk score ${s}</span></div></div>
<div class="mt-2 flex flex-wrap gap-1.5 text-xs">${c.perms.map(p=>h`<span class=${'px-2 py-0.5 rounded '+(/write|export/.test(p)?'bg-red-500/15 text-red-300':'bg-white/10')}>${p}</span>`)}</div>
<div class="text-xs text-slate-400 mt-2">Expiry: ${c.exp||'None'} · IP restriction: ${c.ip?'Yes':'None'}</div>
${!c.rev&&rec(c).length>0&&h`<div class="text-xs mt-2 text-cyan-200">Least-privilege advice: ${rec(c).join('; ')}.</div>`}
<div class="flex flex-wrap gap-2 mt-3">${Bt('Rotate (simulated)',()=>{act(c.id,x=>({...x,exp:new Date(Date.now()+90*864e5).toISOString().slice(0,10)}));log('Rotated '+c.id+' (simulated); 90-day expiry set')},ro||c.rev)}${Bt('Restrict to approved IPs',()=>{act(c.id,x=>({...x,ip:true}));log('IP restriction added to '+c.id)},ro||c.rev||c.ip)}${Bt('Revoke',()=>{act(c.id,x=>({...x,rev:true}));log('Revoked '+c.id);notify(c.id+' revoked','Medium')},!canRev||c.rev,'bg-red-500/20 text-red-300 hover:bg-red-500/30')}</div></div>`})}${!canRev&&h`<p class="text-xs text-slate-400">Only the Admin role can revoke credentials. Auditors have read-only access.</p>`}</div>`,

api:()=>h`<div class="space-y-4"><h2 class="text-xl font-bold">API behaviour monitoring</h2>${Card('Simulated API requests',evTbl(ev,true))}
${Card('Timeline of suspicious activity',h`<ol class="space-y-2 border-l border-red-400/30 ml-2">${ev.filter(e=>e.f==='Suspicious').map(e=>h`<li class="pl-4 text-sm"><span class="text-slate-400 text-xs">${e.t}</span> · ${e.act} <span class="text-slate-400">(${e.ip}, ${e.key})</span></li>`)}</ol>`)}
<p class="text-xs text-slate-400">Internal scheduled sync from 10.20.4.x is classified as Normal. Sample suspicious sources: 198.18.7.41 and 198.18.7.58.</p></div>`,

data:()=>h`<div class="space-y-4"><h2 class="text-xl font-bold">Data protection and exposure</h2>
${Card('Support-ticket scanner',h`<textarea value=${tk} onInput=${e=>{setTk(e.target.value);setScan(null)}} rows="3" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2 text-sm"></textarea><div class="mt-2">${Bt('Scan ticket',()=>{const m=tk.match(/\b(bvk|key|tok)-[a-z0-9]{3,}\b/gi)||[];setScan(m.map(x=>x.slice(0,6)+'••••'));if(m.length){notify('Exposed credential found in ticket (simulated)','High');log('Ticket scan found '+m.length+' exposed credential(s)')}},ro)}</div>
${scan&&(scan.length?h`<div class="mt-3 p-3 rounded-lg bg-red-500/15 border border-red-400/30 pop text-sm"><b class="text-red-300">Credential exposure alert.</b> Found: ${scan.join(', ')} (masked). Rotate the key and remove it from the ticket. ${Bt('Open credential manager',()=>go('cred'))}</div>`:h`<p class="mt-3 text-sm text-emerald-300">No credential patterns found.</p>`)}`)}
${Card('Confidential file-access history',T(['Time','Key','File','Activity','Result'],F0.map(f=>[f.t,f.key,f.file,f.act,B(f.f)])))}</div>`,

mod:()=>h`<div class="space-y-4"><div><h2 class="text-xl font-bold">Content moderation</h2><p class="text-xs text-slate-400">Support tickets, vendor notes and comments are scanned. Flagged content is held for review; escalating it opens an incident.</p></div>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${KPI('Pending review',mcnt('Pending'),'text-sky-300')}${KPI('Redacted',mcnt('Redacted'),'text-violet-300')}${KPI('Removed',mcnt('Removed'),'text-red-300')}${KPI('Escalated',mcnt('Escalated'),'text-amber-300')}</div>
<div class="grid lg:grid-cols-2 gap-3">${Card('Detection rules',h`<div class="space-y-2 text-sm">${MR.map(r=>h`<label class="flex items-center justify-between"><span>${r.name} ${B(r.sev)}</span><input type="checkbox" class="w-4 h-4 accent-blue-400" disabled=${!canRev} checked=${!!mon[r.id]} onChange=${()=>{setMon(o=>({...o,[r.id]:!o[r.id]}));log('Moderation rule “'+r.name+'” '+(mon[r.id]?'disabled':'enabled'))}}/></label>`)}${!canRev&&h`<p class="text-xs text-slate-400">Only Admin can change rules.</p>`}</div>`)}
${Card('Submit test content',h`<div class="space-y-2 text-sm"><select value=${msrc} onChange=${e=>setMsrc(e.target.value)} class="w-full bg-slate-900 border border-white/10 rounded-lg p-2"><option>Support ticket</option><option>Vendor note</option><option>Internal comment</option></select><textarea value=${mtxt} onInput=${e=>setMtxt(e.target.value)} rows="3" placeholder="Try: use key tok-9ab21 and pay the new account 4417002211" class="w-full bg-slate-900 border border-white/10 rounded-lg p-2"></textarea>${Bt('Run moderation',mSubmit,ro||!mtxt.trim())}</div>`)}</div>
${Card('Review queue (highest severity first)',h`<div class="flex flex-wrap gap-2 mb-3">${['Pending','Redacted','Removed','Escalated','Approved','All'].map(s=>Bt(s,()=>setMf(s),false,mf===s?'bg-cyan-400 text-slate-950':'bg-white/5 text-slate-300 hover:bg-white/10'))}</div>
${mshown.length===0?h`<p class="text-sm text-slate-400">Nothing in this view.</p>`:h`<div class="space-y-3">${mshown.map(x=>h`<div class="p-3 rounded-lg bg-white/5 border border-white/5"><div class="flex flex-wrap items-center gap-2 justify-between"><div class="text-xs text-slate-400">${x.id} · ${x.src} · ${x.by} · ${x.t}</div><div class="flex gap-1.5">${x.sev&&B(x.sev)}${B(x.st)}</div></div><p class="text-sm mt-2 break-words">${x.text}</p>
${x.f.length>0&&h`<div class="flex flex-wrap gap-1.5 mt-2">${x.f.map(r=>h`<span class="px-2 py-0.5 rounded text-xs bg-red-500/15 text-red-300">${r.name}</span>`)}</div>`}
${x.st==='Pending'&&h`<div class="flex flex-wrap gap-2 mt-3">${Bt('Approve',()=>mAct(x,'Approved','approved after review'),ro)}${Bt('Redact & approve',()=>mAct(x,'Redacted','sensitive parts redacted',true),ro||!x.f.some(r=>r.mask),'bg-violet-500/20 text-violet-300 hover:bg-violet-500/30')}${Bt('Remove',()=>mAct(x,'Removed','removed'),ro,'bg-red-500/20 text-red-300 hover:bg-red-500/30')}${Bt('Escalate',()=>mAct(x,'Escalated','escalated; incident opened'),ro,'bg-amber-500/20 text-amber-200 hover:bg-amber-500/30')}</div>`}</div>`)}</div>`}`)}</div>`,

inc:()=>{const c=inc.find(x=>x.id===sel)||inc[0];return h`<div class="space-y-4"><h2 class="text-xl font-bold">Incident management</h2><div class="grid lg:grid-cols-2 gap-3">${Card('Alerts and incidents',T(['ID','Title','Severity','Status'],inc.map(x=>[h`<button class="text-cyan-300 underline" onClick=${()=>setSel(x.id)}>${x.id}</button>`,x.title,B(x.sev),B(x.st)])))}
${c&&Card(c.id+' · '+c.title,h`<div class="space-y-3 text-sm"><div class="flex flex-wrap gap-2 items-center"><label class="text-xs text-slate-400">Status</label><select disabled=${ro} value=${c.st} onChange=${e=>setSt(c.id,'st',e.target.value)} class="bg-slate-900 border border-white/10 rounded p-1 text-xs">${['New','Investigating','Contained','Resolved'].map(s=>h`<option>${s}</option>`)}</select><label class="text-xs text-slate-400">Owner</label><select disabled=${ro} value=${c.own} onChange=${e=>setSt(c.id,'own',e.target.value)} class="bg-slate-900 border border-white/10 rounded p-1 text-xs">${['Unassigned','Security Admin','SOC Analyst'].map(s=>h`<option>${s}</option>`)}</select></div>
<ol class="space-y-1 border-l border-cyan-400/30 ml-2">${c.tl.map(t=>h`<li class="pl-3 text-xs"><span class="text-slate-400">${t[0]}</span> ${t[1]}</li>`)}</ol>
<div><div class="text-xs text-slate-400 mb-1">Recommended response</div><ul class="list-disc ml-5 text-xs space-y-0.5">${c.rc.map(r=>h`<li>${r}</li>`)}</ul></div>${Bt('Create incident report',()=>setRep(c))}</div>`)}</div></div>`},

aud:()=>h`<div class="space-y-4"><h2 class="text-xl font-bold">Security event history and audit trail</h2>${Card('Audit trail',T(['Time','User','Action'],aud.map(a=>[a.t,a.u,a.m])))}</div>`,

help:()=>h`<div class="space-y-4 max-w-3xl"><h2 class="text-xl font-bold">Help and documentation</h2>${Card('How HARBOR GUARD covers the problems',h`<ul class="text-sm space-y-2 list-disc ml-5"><li><b>Unauthorised bank changes:</b> Financial protection blocks any change without an approval reference.</li><li><b>Misused API credentials:</b> Credential manager scores risk, flags missing expiry and IP limits, and simulates rotation and revocation.</li><li><b>Bulk exports:</b> API monitoring flags unusual volumes and sources, and simulates blocking.</li><li><b>Exposed credentials:</b> Data exposure scans tickets and shows masked results only.</li><li><b>Risky content:</b> Moderation holds flagged tickets and notes, redacts sensitive parts, and escalates to incidents.</li><li><b>Slow response:</b> Incidents tracks status, owner, timeline and an audit trail.</li></ul><p class="text-xs text-slate-400 mt-3">Roles: Admin can do everything, Analyst cannot revoke keys or change moderation rules, Auditor is read-only. Start with “RUN SECURITY SIMULATION” on the dashboard. Everything here is fictional and local to this page; it provides no real protection.</p><p class="text-xs text-slate-400 mt-2">Designed and coded by Team ${TEAM}.</p>`)}</div>`};

return h`<div class="min-h-screen flex flex-col md:flex-row">
<nav class="md:w-60 md:min-h-screen g rounded-none border-0 border-b md:border-b-0 md:border-r p-3 flex md:flex-col gap-1 overflow-x-auto shrink-0"><div class="hd font-bold text-lg px-2 py-1 md:mb-4 whitespace-nowrap text-cyan-300">HARBOR GUARD</div>${NAV.map(([k,l])=>h`<button onClick=${()=>go(k)} class=${'text-left whitespace-nowrap px-3 py-2 rounded-lg text-sm transition '+(view===k?'bg-cyan-500/20 text-cyan-200':'text-slate-400 hover:bg-white/5')}>${l}</button>`)}<div class="hidden md:block mt-auto px-2 py-3 text-xs text-slate-500">Built by Team <b class="text-cyan-300">${TEAM}</b></div></nav>
<div class="flex-1 min-w-0"><header class="flex items-center gap-3 p-3 border-b border-white/5 relative"><div class="flex-1 relative"><input value=${q} onInput=${e=>setQ(e.target.value)} placeholder="Search vendors, keys, incidents, events, content" class="w-full bg-slate-900/70 border border-white/10 rounded-lg px-3 py-2 text-sm"/>${results.length>0&&h`<div class="absolute z-20 mt-1 w-full g p-1 bg-slate-950">${results.map(r=>h`<button onClick=${()=>{go(r[2]);setQ('')}} class="w-full text-left px-3 py-2 text-sm rounded hover:bg-white/10">${r[0]} <span class="text-xs text-slate-400">· ${r[1]}</span></button>`)}</div>`}</div>
<button onClick=${()=>setBell(!bell)} class="relative px-3 py-2 rounded-lg bg-white/5 text-sm">Alerts <span class="ml-1 px-1.5 rounded-full bg-red-500 text-xs">${notes.length}</span></button><span class="text-xs text-slate-400 hidden sm:block">${user} · ${role}</span>${Bt('Sign out',()=>setUser(null),false,'bg-white/10 text-slate-200')}
${bell&&h`<div class="absolute right-3 top-14 z-30 w-80 max-w-[92vw] g p-3 bg-slate-950 pop max-h-96 overflow-auto"><div class="flex justify-between mb-2 text-sm font-semibold">Notification centre ${Bt('Clear',()=>setN([]),false,'bg-white/10 text-slate-200')}</div>${notes.length?notes.map(n=>h`<div class="py-2 border-t border-white/5 text-xs"><div>${n.m}</div><div class="text-slate-400 mt-0.5">${n.t} ${B(n.s)}</div></div>`):h`<p class="text-xs text-slate-400">No notifications. Run the simulation to generate some.</p>`}</div>`}</header>
<main class="p-4 pop" key=${view}>${views[view]()}</main></div>
${rep&&h`<div class="fixed inset-0 z-40 bg-black/70 grid place-items-center p-4" onClick=${()=>setRep(null)}><div class="g bg-slate-950 p-5 max-w-lg w-full pop" onClick=${e=>e.stopPropagation()}><h3 class="hd font-bold mb-2">Incident report: ${rep.id}</h3><pre class="text-xs whitespace-pre-wrap bg-slate-900 p-3 rounded-lg max-h-72 overflow-auto">${'SIMULATED INCIDENT REPORT\nID: '+rep.id+'\nTitle: '+rep.title+'\nSeverity: '+rep.sev+'\nStatus: '+rep.st+'\nOwner: '+rep.own+'\n\nTimeline:\n'+rep.tl.map(t=>'- '+t[0]+' '+t[1]).join('\n')+'\n\nRecommended response:\n'+rep.rc.map(r=>'- '+r).join('\n')+'\n\nAll data is fictional. Prepared by Team '+TEAM+'.'}</pre><div class="flex gap-2 mt-3">${Bt('Copy report',()=>{try{navigator.clipboard.writeText(document.querySelector('pre').innerText);log('Report for '+rep.id+' copied')}catch(e){}})}${Bt('Close',()=>setRep(null),false,'bg-white/10 text-slate-200')}</div></div></div>`}</div>`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
